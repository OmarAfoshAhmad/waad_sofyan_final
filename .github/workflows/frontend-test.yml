name: Frontend Quality

on:
  push:
    branches: [ main, develop, provider-price-lists-employer-scope ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
      # memberCapabilityPermissions.test.js reads the server's permission map
      # as text. A backend-only change that renames or removes a permission
      # would otherwise not run the test that exists to catch exactly that.
      - 'backend/src/main/java/com/waad/tba/modules/member/security/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/com/waad/tba/modules/member/security/**'

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npm run type-check
        continue-on-error: true

      - name: Lint
        run: |
          cd frontend
          npm run lint
        continue-on-error: true

      # No continue-on-error, unlike the two steps above: these assert
      # behaviour rather than style. Among them are the checks that a page of
      # members costs one ceiling request rather than one per row, and that
      # the buttons this app draws are gated on the permissions the server
      # actually requires. A test that guards an invariant and never runs in
      # the gate is documentation with a green tick next to it.
      - name: Test
        run: |
          cd frontend
          npm test

      - name: Build
        run: |
          cd frontend
          npm run build
