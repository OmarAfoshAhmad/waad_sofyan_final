name: Security Audit

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
  # A gate that only runs after the merge is a report, not a gate.
  pull_request:
    branches: [ main, develop ]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Blocking. This step used to carry continue-on-error, which is how 17
      # high-severity advisories (one of them, xlsx, with no upstream fix)
      # accumulated on main without a single red build.
      #
      # Threshold is high: the two advisories left below it are moderate and
      # accepted -- uuid < 11.1.1 (GHSA-w5hq-g745-h8pq) reached through
      # exceljs, whose every release depends on uuid 8. The flaw is in
      # v3/v5/v6 when the caller passes its own buffer; exceljs only calls
      # v4(). Revisit when exceljs moves off uuid 8 or when a caller of ours
      # starts using uuid directly.
      - name: npm audit (Frontend)
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

      # Advisory only. OWASP dependency-check needs an NVD API key to run
      # reliably (unauthenticated requests are throttled to the point of
      # timing out), so it cannot be made blocking until NVD_API_KEY exists
      # as a repository secret. Until then its output is for reading, not
      # gating -- and the comment above says so rather than pretending.
      - name: Maven dependency check (advisory)
        run: |
          cd backend
          mvn org.owasp:dependency-check-maven:check
        continue-on-error: true
