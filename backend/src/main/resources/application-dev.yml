spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tba_waad_system}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  flyway:
    validate-on-migrate: false
    clean-disabled: false
    out-of-order: false

jwt:
  # Required explicitly in every environment to prevent accidental reuse.
  secret: ${JWT_SECRET}

app:
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:}
    sync-password-on-startup: ${ADMIN_SYNC_PASSWORD_ON_STARTUP:false}
  cors:
    allowed-origins: "https://waadapp.ly,https://www.waadapp.ly,http://localhost:3000,http://localhost:3005,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3005"

logging:
  level:
    root: INFO
    com.waad.tba: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
